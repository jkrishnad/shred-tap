[package]
name = "shredtap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pcap = { version = "2.5.0", optional = true }
reed-solomon-erasure = "6.0.0"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
solana-address = { version = "2.9.0", default-features = false, features = ["decode"] }
solana-hash = { version = "4.7.0", features = ["wincode"] }
solana-signature = { version = "3.6.0", features = ["verify"] }
solana-transaction = { version = "5.1.0", features = ["wincode"] }
thiserror = "2.0.21"
wincode = "0.6.2"

[features]
# shredtap live, reading packets straight from a network interface, needs libpcap to build
live = ["dep:pcap"]
