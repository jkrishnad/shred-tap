# nats-server for shredtap on the validator node.
# Clients connect on localhost only. Browsers reach the websocket listener through Caddy on /feed.
listen: 127.0.0.1:4222
# monitoring, for curl 127.0.0.1:8222/jsz on the node
http: 127.0.0.1:8222
server_name: shredtap

# the largest message is the history snapshot a page opens with, under 112 KB
max_payload: 128KB
# every open page is one connection, so a handful of clients can't lock the rest out
max_connections: 1024
# a reader that can't keep up for 2 s is cut off, it never holds anything up
write_deadline: "2s"

authorization {
  users: [
    # shredtap and the nats tool on the node: plain connections on localhost, full rights
    { user: shredtap, allowed_connection_types: ["STANDARD"] }
    # every browser: websocket only, may read shred.public live, and the latest history snapshot
    # with one direct get whose reply comes back on its own inbox, and nothing else
    {
      user: public
      allowed_connection_types: ["WEBSOCKET"]
      permissions: {
        publish: { allow: ["$JS.API.DIRECT.GET.SHRED_HISTORY.shred.history"] }
        subscribe: { allow: ["shred.public", "_INBOX_public.>"] }
      }
    }
  ]
}
# a plain connection with no user is shredtap
no_auth_user: shredtap

websocket {
  # Caddy terminates TLS and forwards /feed here, so this stays on localhost without TLS
  listen: 127.0.0.1:4280
  no_tls: true
  # a websocket with no user is public
  no_auth_user: public
  # browsers may only open it from the site, or from a local preview through an SSH tunnel
  allowed_origins: ["https://shreds.vyralabs.fun", "https://shred-tap.vercel.app", "http://localhost:3000"]
}

jetstream {
  # on the root drive, never the drive with the ledger and accounts
  store_dir: /var/lib/nats
  max_memory_store: 64MB
  # the two streams cap themselves at about 2.1 GB together
  max_file_store: 4GB
}
