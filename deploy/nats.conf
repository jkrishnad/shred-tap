# nats-server for shredtap on the validator node.
# Clients connect on localhost only, nothing listens on a public address.
listen: 127.0.0.1:4222
# monitoring, for curl 127.0.0.1:8222/jsz on the node
http: 127.0.0.1:8222
server_name: shredtap

# the largest message, a slot with its footer, is about 1.5 KB
max_payload: 64KB
max_connections: 64

jetstream {
  # on the root drive, never the drive with the ledger and accounts
  store_dir: /var/lib/nats
  max_memory_store: 64MB
  # the three streams cap themselves at about 2.6 GB together
  max_file_store: 4GB
}
